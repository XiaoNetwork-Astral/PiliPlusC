name: Build for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Windows x64
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Add fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows
        continue-on-error: true

      - name: Build Windows
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean

      - name: Prepare Upload
        run: |
          mkdir -p Release/PiliPlusC-Win
          mv build/windows/x64/runner/Release/* Release/PiliPlusC-Win/
          mv dist/**/*.exe PiliPlusC_windows_${{ env.TAG }}_x64_setup.exe

      - name: Compress
        run: |
          Compress-Archive -Path "Release/PiliPlusC-Win" -DestinationPath "PiliPlusC_windows_${{ env.TAG }}_x64_portable.zip"
        shell: pwsh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            PiliPlusC_windows_*.zip
            PiliPlusC_windows_*.exe
