name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-mac-app:
    name: macOS
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS
        continue-on-error: true

      - name: Build Mac
        run: |
          flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Prepare Upload
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/PiliPlusC.app || true
        continue-on-error: true

      - name: Rename DMG
        run: mv PiliPlusC*.dmg PiliPlusC_macos_${{ env.TAG }}.dmg

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: PiliPlusC_macos_*.dmg
