name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as a release, leave empty for a test build that only uploads artifacts"
        required: false
        default: ""
        type: string
      build_android:
        description: "Build Android"
        required: false
        default: true
        type: boolean
      build_ios:
        description: "Build iOS"
        required: false
        default: true
        type: boolean
      build_mac:
        description: "Build macOS"
        required: false
        default: true
        type: boolean
      build_windows:
        description: "Build Windows"
        required: false
        default: true
        type: boolean
      build_linux:
        description: "Build Linux"
        required: false
        default: true
        type: boolean

jobs:
  android:
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

  ios:
    if: ${{ github.event_name == 'push' || inputs.build_ios }}
    uses: ./.github/workflows/ios.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

  mac:
    if: ${{ github.event_name == 'push' || inputs.build_mac }}
    uses: ./.github/workflows/mac.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

  windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    uses: ./.github/workflows/win_x64.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

  linux:
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    uses: ./.github/workflows/linux.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

  release:
    name: Publish release
    needs: [android, ios, mac, windows, linux]
    # 只要有一个平台成功且带着 tag 就发布，没跑的平台（被跳过）不阻塞
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.tag != '') && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/*
