name: Build for Android

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
    secrets:
      KEYSTORE_FILE:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Write signing key
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 --decode > android/app/key.jks
            {
              echo "storeFile=key.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "No signing key configured, falling back to the debug key"
          fi

      - name: Set and extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

      - name: Rename
        run: |
          mkdir -p out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "build/app/outputs/flutter-apk/app-${abi}-release.apk" "out/PiliPlusC_android_${TAG}_${abi}.apk"
          done
          ls -lh out

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
